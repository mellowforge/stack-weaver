name: Deploy demo site

# Landing page at /, Angular tab app at /angular/, React tab app at /react/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the canonical repository publishes; forks would fail without Pages enabled.
    if: github.repository == 'mellowforge/stack-weaver'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages first: the tests import their built dist
      - run: pnpm -r build
      - run: pnpm -r test
      # GITHUB_REPOSITORY is set by Actions, so the site gets the /<repo>/ base path
      # (the same steps as the root `pnpm build:site`, without building the packages twice)
      - run: pnpm --filter stack-weaver-site build:site
        env:
          # The npm links show once the repository variable SHOW_NPM is set to 1 (after the first publish);
          # unset, it is empty and the site hides them
          SHOW_NPM: ${{ vars.SHOW_NPM }}
      - run: pnpm --filter stack-weaver-site check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
